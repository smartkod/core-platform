services:
  postgres:
    image: postgres:15-alpine
    # Docker Desktop's internal DNS occasionally fails while a network is being
    # created, which kills a starting app with "network is unreachable". The
    # retry policy lets the app recover on its own instead of staying dead.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_platform
    ports:
      - "${DB_PORT_HOST:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: core_platform
      DB_SSLMODE: disable
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Development defaults so `docker compose up` works with no setup.
      #
      # PRODUCTION: delete these two lines and supply the secrets from the
      # environment or a secret manager. Committing a default secret is how a
      # staging key ends up signing production tokens.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-0123456789abcdef0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-fedcba9876543210fedcba9876543210}
    depends_on:
      postgres:
        condition: service_healthy
    # Uploads survive a container rebuild. Without this volume every uploaded
    # file disappears the next time the image is rebuilt.
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
