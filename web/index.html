<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Platform — Yönetim</title>
  <meta name="description" content="İşletme, şube, ekip ve katalog yönetimi.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M10 21V11h4.2c2.6 0 4.3 1.2 4.3 3.3 0 1.5-.8 2.5-2.2 3l2.7 3.7h-2.8l-2.3-3.3H12V21z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <strong>Core Platform</strong>
      <span class="muted" id="api-label" hidden></span>
    </div>
    <div class="topbar-right">
      <span class="muted" id="whoami"></span>
      <button class="btn ghost" id="logout" type="button" hidden>Çıkış</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Signed out -->
    <section id="auth-view" class="card narrow" hidden aria-labelledby="auth-title">
      <h1 id="auth-title">Yönetim paneli</h1>
      <p class="hint" style="margin: 4px 0 20px">İşletmenizi yönetmek için giriş yapın.</p>

      <div class="tabs" role="tablist" aria-label="Giriş veya kayıt">
        <button class="tab active" data-auth="login" role="tab" aria-selected="true" type="button">Giriş</button>
        <button class="tab" data-auth="register" role="tab" aria-selected="false" type="button">Kayıt</button>
      </div>

      <form id="auth-form" class="stack" novalidate>
        <label>
          E-posta
          <input type="email" name="email" autocomplete="username" required inputmode="email" spellcheck="false">
        </label>
        <label>
          Parola
          <input type="password" name="password" autocomplete="current-password" minlength="10" required>
        </label>
        <label class="register-only" hidden>
          Ad
          <input type="text" name="name" autocomplete="name">
        </label>
        <button class="btn primary" type="submit" id="auth-submit">Giriş yap</button>
        <p class="hint" id="auth-hint">Hesabınız yoksa “Kayıt” sekmesine geçin.</p>
      </form>
    </section>

    <!-- Signed in -->
    <section id="app-view" hidden>
      <div class="card orgbar">
        <label class="grow">
          İşletme
          <select id="org-select"></select>
        </label>
        <button class="btn" id="new-org-toggle" type="button" aria-expanded="false">+ Yeni işletme</button>
      </div>

      <form id="new-org-form" class="card stack" hidden aria-label="Yeni işletme">
        <div class="row">
          <label class="grow">
            Ad
            <input type="text" name="name" required placeholder="Örnek Kuaför" autocomplete="organization">
          </label>
          <label class="grow">
            Slug
            <input type="text" name="slug" required placeholder="ornek-kuafor" pattern="[a-z0-9][a-z0-9-]*" spellcheck="false">
          </label>
        </div>
        <div class="row">
          <button class="btn primary" type="submit">Oluştur</button>
          <button class="btn ghost" type="button" id="new-org-cancel">Vazgeç</button>
        </div>
      </form>

      <div id="org-meta" class="card muted" hidden></div>

      <nav class="tabs tabs--main" id="tabs" role="tablist" aria-label="İşletme bölümleri" hidden>
        <button class="tab active" data-tab="general" type="button" role="tab" aria-selected="true">Genel</button>
        <button class="tab" data-tab="branches" type="button" role="tab" aria-selected="false">Şubeler</button>
        <button class="tab" data-tab="members" type="button" role="tab" aria-selected="false">Ekip</button>
        <button class="tab" data-tab="catalog" type="button" role="tab" aria-selected="false">Katalog</button>
        <button class="tab" data-tab="notifications" type="button" role="tab" aria-selected="false">Bildirimler</button>
      </nav>

      <div id="panel" class="panel" role="tabpanel" tabindex="-1"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
