<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Platform — Yönetim</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <strong>Core Platform</strong>
      <span class="muted" id="api-label"></span>
    </div>
    <div class="topbar-right">
      <span class="muted" id="whoami"></span>
      <button class="btn ghost" id="logout" hidden>Çıkış</button>
    </div>
  </header>

  <main>
    <!-- Login / register -->
    <section id="auth-view" class="card narrow" hidden>
      <div class="tabs" role="tablist">
        <button class="tab active" data-auth="login" role="tab">Giriş</button>
        <button class="tab" data-auth="register" role="tab">Kayıt</button>
      </div>

      <form id="auth-form" class="stack" novalidate>
        <label>
          E-posta
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>
          Parola
          <input type="password" name="password" autocomplete="current-password" minlength="10" required>
        </label>
        <label class="register-only" hidden>
          Ad
          <input type="text" name="name" autocomplete="name">
        </label>
        <button class="btn primary" type="submit" id="auth-submit">Giriş yap</button>
        <p class="hint" id="auth-hint">Hesabınız yoksa “Kayıt” sekmesine geçin.</p>
      </form>

      <details class="advanced">
        <summary>Bağlantı ayarı</summary>
        <label>
          API adresi
          <input type="url" id="api-base" placeholder="http://localhost:18080">
        </label>
      </details>
    </section>

    <!-- Signed in -->
    <section id="app-view" hidden>
      <div class="card orgbar">
        <label class="grow">
          İşletme
          <select id="org-select"></select>
        </label>
        <button class="btn" id="new-org-toggle" type="button">+ Yeni işletme</button>
      </div>

      <form id="new-org-form" class="card stack" hidden>
        <div class="row">
          <label class="grow">
            Ad
            <input type="text" name="name" required placeholder="Örnek Kuaför">
          </label>
          <label class="grow">
            Slug
            <input type="text" name="slug" required placeholder="ornek-kuafor" pattern="[a-z0-9][a-z0-9-]*">
          </label>
        </div>
        <div class="row">
          <button class="btn primary" type="submit">Oluştur</button>
          <button class="btn ghost" type="button" id="new-org-cancel">Vazgeç</button>
        </div>
      </form>

      <div id="org-meta" class="card muted" hidden></div>

      <nav class="tabs tabs--main" id="tabs" hidden>
        <button class="tab active" data-tab="general" type="button">Genel</button>
        <button class="tab" data-tab="branches" type="button">Şubeler</button>
        <button class="tab" data-tab="members" type="button">Ekip</button>
        <button class="tab" data-tab="catalog" type="button">Katalog</button>
        <button class="tab" data-tab="notifications" type="button">Bildirimler</button>
      </nav>

      <div id="panel" class="panel"></div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
