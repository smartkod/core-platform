name: Deploy Core Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No secret is passed as a build argument. Configuration (JWT secrets,
      # database credentials) is supplied at runtime by the environment, so it
      # never lands in an image layer where anyone who pulls the image can read
      # it. See PRD.md §8.1.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg COMMIT=${{ github.sha }} \
            -t core-platform:${{ github.sha }} .

      - name: Push to Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker tag core-platform:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/core-platform:latest
          docker tag core-platform:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/core-platform:${{ github.ref_name }}
          docker push ${{ secrets.REGISTRY_URL }}/core-platform:latest
          docker push ${{ secrets.REGISTRY_URL }}/core-platform:${{ github.ref_name }}
