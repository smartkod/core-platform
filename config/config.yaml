# Core Platform — config

env: development

server:
  host: 0.0.0.0
  port: 8080

db:
  host: localhost
  port: 5432
  user: postgres
  name: core_platform
  sslmode: disable
  max_open_conns: 25
  slow_query: 200ms

http:
  body_limit: 8M
  request_timeout: 30s
  shutdown_timeout: 10s

log:
  level: info
  format: json

security:
  # Origins allowed to call the API from a browser. Add the web UI's origin;
  # required in production and "*" is rejected there.
  allowed_origins:
    - http://localhost:3000

# Identity. Secrets may come from here or from JWT_ACCESS_SECRET /
# JWT_REFRESH_SECRET. Production refuses to start without them.
identity:
  access_ttl: 15m
  refresh_ttl: 168h
  password_min_length: 10
  cookie_secure: false
