# Core Platform — config

env: development

server:
  host: 0.0.0.0
  port: 8080

db:
  host: localhost
  port: 5432
  user: postgres
  name: core_platform
  sslmode: disable
  max_open_conns: 25
  slow_query: 200ms

http:
  body_limit: 8M
  request_timeout: 30s
  shutdown_timeout: 10s

log:
  level: info
  format: json

security:
  allowed_origins: []

# L1 identity. Secrets may come from here or from JWT_ACCESS_SECRET /
# JWT_REFRESH_SECRET. Production refuses to start without them.
identity:
  access_ttl: 15m
  refresh_ttl: 168h
  password_min_length: 10
  cookie_secure: false

files:
  driver: local
  local_root: data/uploads
  max_size: 10MB
  signed_url_ttl: 15m

# AI (L3). The API key is read from AI_API_KEY only and never written here.
ai:
  enabled: false
  base_url: https://api.example.com/v1
  default_model:
  request_timeout: 60s
  max_retries: 2
