# Core Platform — config

env: development

server:
  host: 0.0.0.0
  port: 8080

db:
  host: localhost
  port: 5432
  user: postgres
  name: core_platform
  sslmode: disable
  max_open_conns: 25
  slow_query: 200ms

http:
  body_limit: 8M
  request_timeout: 30s
  shutdown_timeout: 10s

log:
  level: info
  format: json

security:
  # Origins allowed to call the API from a browser. Add the web UI's origin;
  # required in production and "*" is rejected there.
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:3100
    - http://127.0.0.1:3100
  # Addresses allowed to report the client through X-Forwarded-For.
  #
  # Empty means "no proxy": the header is ignored and the socket address is
  # used. That is the safe default, because the header is caller-controlled —
  # trusting it from anyone lets a caller mint a fresh rate-limit budget with
  # every request.
  #
  # The loopback entries below exist for local development only, so the test
  # suites can simulate separate clients from one machine. In production list
  # the reverse proxy's range (for example 10.0.0.0/8) and nothing else.
  trusted_proxies:
    - 127.0.0.1/32
    - ::1/128
  # How many resources one account may create per window.
  #
  # Keyed on the user, not the address: rotating IPs must not reset it and a
  # shared office network must not exhaust it for everyone. Only creation is
  # counted; edits are bounded by the object being edited.
  write_limit: 30
  write_window: 1h

# Identity. Secrets may come from here or from JWT_ACCESS_SECRET /
# JWT_REFRESH_SECRET. Production refuses to start without them.
identity:
  access_ttl: 15m
  refresh_ttl: 168h
  password_min_length: 10
  cookie_secure: false
