# Core Platform — config example
#
# Copy the values you need into config/config.yaml or the environment.
# Secrets belong in .env (never committed), not in this file.

env: development

server:
  host: 0.0.0.0
  port: 8080

db:
  host: localhost
  port: 5432
  user: postgres
  password: ""
  name: core_platform
  sslmode: disable
  max_open_conns: 25
  slow_query: 200ms

http:
  body_limit: 8M
  request_timeout: 30s
  shutdown_timeout: 10s

log:
  level: info
  format: json

security:
  # Origins allowed to call the API from a browser. Add the web UI's origin;
  # required in production and "*" is rejected there.
  allowed_origins:
    - http://localhost:3000
  # Addresses allowed to report the client through X-Forwarded-For.
  #
  # Leave this empty unless a reverse proxy you control sits in front of the
  # API. Empty means the header is ignored and the socket address is used,
  # which is what stops a caller from resetting its own rate-limit budget.
  #
  # Development: add 127.0.0.1/32 and ::1/128 so the test suites can simulate
  # separate clients from one machine. In production list only the proxy's
  # range (for example 10.0.0.0/8).
  trusted_proxies: []
  # How many resources one account may create per window.
  #
  # Keyed on the user, not the address: rotating IPs must not reset it and a
  # shared office network must not exhaust it for everyone. Only creation is
  # counted; edits are bounded by the object being edited.
  write_limit: 30
  write_window: 1h

identity:
  access_ttl: 15m
  refresh_ttl: 168h
  password_min_length: 10
  cookie_secure: false
  # access_secret / refresh_secret are env-only in practice:
  # JWT_ACCESS_SECRET and JWT_REFRESH_SECRET.
